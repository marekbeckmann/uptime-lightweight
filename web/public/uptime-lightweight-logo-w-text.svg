<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 160" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="banner-bg" x1="0" y1="0" x2="0" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111113" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="icon-surface" x1="80" y1="24" x2="80" y2="136" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#0d0d10" />
    </linearGradient>
    <linearGradient id="emerald-bar" x1="0" y1="50" x2="0" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Dunkler Banner-Container (1px Hairline-Border im Zinc-Design) -->
  <rect x="2" y="2" width="676" height="156" rx="14" fill="url(#banner-bg)" stroke="#27272a" stroke-width="2" />

  <!-- ================= ICON MARK (Links) ================= -->
  <g transform="translate(28, 24)">
    <!-- Icon Box -->
    <rect x="0" y="0" width="112" height="112" rx="24" fill="url(#icon-surface)" stroke="#3f3f46" stroke-width="2" stroke-opacity="0.7" />
    
    <!-- Horizontale Baseline -->
    <line x1="18" y1="56" x2="94" y2="56" stroke="#27272a" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />

    <!-- 3 Heartbeat-Ticks -->
    <rect x="26" y="38" width="14" height="50" rx="4" fill="#10b981" fill-opacity="0.28" />
    <rect x="49" y="55" width="14" height="33" rx="4" fill="#10b981" fill-opacity="0.60" />
    <rect x="72" y="44" width="14" height="44" rx="4" fill="url(#emerald-bar)" />

    <!-- Status Dot -->
    <circle cx="79" cy="29" r="6.5" fill="#10b981" />
    <circle cx="79" cy="29" r="10" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.3" />
  </g>

  <!-- ================= WORDMARK (Rechts) ================= -->
  <!-- Haupt-Schriftzug: "uptime" (Sans) + "-mon" (Monospace Emerald) -->
  <text x="168" y="86" fill="#f4f4f5" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="700" letter-spacing="-1.5">
    uptime<tspan fill="#52525b" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, monospace" font-weight="400" letter-spacing="-2">-</tspan><tspan fill="#10b981" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, monospace" font-weight="600" letter-spacing="-1">mon</tspan>
  </text>

  <!-- Kleines Versions-/Architektur-Badge neben dem Titel -->
  <rect x="450" y="57" width="58" height="24" rx="5" fill="#18181b" stroke="#27272a" stroke-width="1.5" />
  <text x="479" y="73" fill="#a1a1aa" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.8">
    YAML
  </text>

  <!-- Subline / Tagline im technischen Telemetrie-Stil -->
  <circle cx="175" cy="116" r="3.5" fill="#10b981" />
  <text x="187" y="120" fill="#71717a" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace" font-size="12" font-weight="500" letter-spacing="1.6">
    LIGHTWEIGHT DECLARATIVE UPTIME MONITOR
  </text>
</svg>