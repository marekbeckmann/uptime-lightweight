# Ping endpoint (ICMP with unprivileged UDP fallback)
- id: "gateway-ping"
  display_name: "OPNsense Gateway"
  zone: "networking"
  icon: "opnsense"
  type: "ping"
  target: "1.1.1.1"
  interval: "30s"
  timeout: "3s"
  retries: 3
  show_target: false

# TCP 3-way handshake check
- id: "dns-tcp"
  display_name: "Cloudflare DNS TCP"
  zone: "networking"
  icon: "cloudflare"
  type: "tcp"
  target: "1.1.1.1"
  port: 53
  interval: "30s"
  timeout: "3s"
  retries: 3
  show_target: false

# DNS resolution check (DoH RFC 8484)
- id: "adguard-doh"
  display_name: "AdGuard DoH"
  zone: "networking"
  icon: "adguardhome"
  type: "dns"
  hostname: "cloudflare.com"
  server: "https://dns.adguard-dns.com/dns-query"
  protocol: "doh"
  port: 443
  query_type: "A"
  interval: "60s"
  timeout: "5s"
  retries: 3
  show_target: false

# HTTPS check with wildcard status codes and TLS expiry tracking
- id: "public-portal"
  display_name: "Cloudflare Web Portal"
  zone: "webserver"
  icon: "cloudflare"
  type: "https"
  target: "https://cloudflare.com"
  method: "GET"
  accepted_status_codes:
    - "20X"
    - "30X"
  ignore_tls_errors: false
  tls_expiry_warn_days: [14, 7, 3]
  interval: "60s"
  timeout: "5s"
  retries: 3
  show_target: true
