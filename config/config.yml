# Global settings for uptime-mon
interval: "60s"
timeout: "5s"
retries: 3
timezone: "Europe/Berlin"
history_retention_days: 30
selfhst_icon_cdn: "https://cdn.jsdelivr.net/gh/selfhst/icons/svg/{icon}.svg"

# Zone Collapse Behavior (optional)
# disableCollapse: true|false (default: false) - If true, zones cannot be collapsed and remain permanently expanded
# initiallyCollapsed: true|false (default: false) - If true, all zones start collapsed on fresh dashboard load
disableCollapse: false
initiallyCollapsed: false

# Optional Custom UI Branding
# Supports dynamic pre-defined variables:
#   {current_year}, {current_month}, {current_date}, {current_time}, {timezone}
#   {version}, {hostname}, {total_endpoints}, {total_hosts}, {total_zones}
branding:
  title: "Status Dashboard"
  subtitle: "for my awesome homelab"
  footer: "© {current_year} some-domain.org"
  icon: ""
  favicon: ""
  tab_title: "Status Dashboard"
